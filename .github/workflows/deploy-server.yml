name: Deploy Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: "24.12.0"
  INSTANCE_ID: "i-0a44924e1ad597b3e"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-pdz

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Package build
        run: |
          tar -czf server-build.tgz \
            dist \
            node_modules \
            ecosystem.config.js \
            package.json \
            package-lock.json
          ls -lh server-build.tgz

      - name: Upload artifact to S3
        run: |
          aws s3 cp server-build.tgz s3://pokemondraftzone.api/server-builds/${{ github.sha }}.tgz

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy pokemon-draftzone-server" \
            --query "Command.CommandId" --output text \
            --parameters 'commands=[
              "set -ex",
              "sudo -u ubuntu mkdir -p /home/ubuntu/pokemon-draftzone-server",
              "sudo -u ubuntu aws s3 cp s3://pokemondraftzone.api/server-builds/${{ github.sha }}.tgz /home/ubuntu/pokemon-draftzone-server/server-build.tgz",
              "sudo -u ubuntu rm -rf /home/ubuntu/pokemon-draftzone-server/dist /home/ubuntu/pokemon-draftzone-server/node_modules",
              "sudo -u ubuntu tar -xzf /home/ubuntu/pokemon-draftzone-server/server-build.tgz -C /home/ubuntu/pokemon-draftzone-server",
              "test -f /home/ubuntu/pokemon-draftzone-server/dist/main.js",
              "test -d /home/ubuntu/pokemon-draftzone-server/node_modules/@nestjs/core",
              "test -d /home/ubuntu/pokemon-draftzone-server/node_modules/@pdz/sets/build",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && node -v && npm -v\"",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && pm2 update && pm2 startOrReload /home/ubuntu/pokemon-draftzone-server/ecosystem.config.js --only pmdz\"",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && pm2 jlist\""
            ]')
          echo "CommandId=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

          DEADLINE=$(( SECONDS + 900 ))
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut)
                echo "Reached terminal status: ${STATUS}"
                break
                ;;
            esac
            if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              echo "::error::Gave up after 15m; SSM command ${COMMAND_ID} is still ${STATUS}"
              break
            fi
            sleep 10
          done

      - name: Report deploy result
        if: always() && env.COMMAND_ID != ''
        run: |
          set -uo pipefail
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" > invocation.json

          echo "--- invocation ---"
          jq 'del(.StandardOutputContent, .StandardErrorContent)' invocation.json

          echo "--- stdout ---"
          jq -r '.StandardOutputContent' invocation.json
          echo "--- stderr ---"
          jq -r '.StandardErrorContent' invocation.json

          STATUS=$(jq -r '.Status' invocation.json)
          DETAILS=$(jq -r '.StatusDetails // "none"' invocation.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // "none"' invocation.json)
          echo "Invocation status: ${STATUS} (${DETAILS}), response code: ${RESPONSE_CODE}"

          if [ "$RESPONSE_CODE" = "-1" ]; then
            echo "::error::SSM never ran the script on ${INSTANCE_ID} (${DETAILS}). Check that the instance is running and the SSM agent is connected."
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy script failed on ${INSTANCE_ID} with status ${STATUS} (${DETAILS})"
            exit 1
          fi
