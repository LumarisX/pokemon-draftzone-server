name: Deploy Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: "24.12.0"
  INSTANCE_ID: "i-0a44924e1ad597b3e"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-pdz

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Package build
        run: |
          tar -czf server-build.tgz \
            dist \
            ecosystem.config.js \
            package.json \
            package-lock.json

      - name: Upload artifact to S3
        run: |
          aws s3 cp server-build.tgz s3://pokemondraftzone.api/server-builds/${{ github.sha }}.tgz

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy pokemon-draftzone-server" \
            --query "Command.CommandId" --output text \
            --parameters 'commands=[
              "set -ex",
              "sudo -u ubuntu mkdir -p /home/ubuntu/pokemon-draftzone-server",
              "sudo -u ubuntu aws s3 cp s3://pokemondraftzone.api/server-builds/${{ github.sha }}.tgz /home/ubuntu/pokemon-draftzone-server/server-build.tgz",
              "sudo -u ubuntu tar -xzf /home/ubuntu/pokemon-draftzone-server/server-build.tgz -C /home/ubuntu/pokemon-draftzone-server",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && node -v && npm -v && which node npm git\"",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && cd /home/ubuntu/pokemon-draftzone-server && npm install --omit=dev\"",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && pm2 update && pm2 startOrReload /home/ubuntu/pokemon-draftzone-server/ecosystem.config.js --only pmdz\"",
              "sudo -u ubuntu bash -lc \"source /home/ubuntu/.nvm/nvm.sh && nvm use ${{ env.NODE_VERSION }} && pm2 jlist\""
            ]')
          echo "CommandId=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

      - name: Report deploy result
        if: always() && env.COMMAND_ID != ''
        run: |
          set -uo pipefail
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" > invocation.json

          echo "--- stdout ---"
          jq -r '.StandardOutputContent' invocation.json
          echo "--- stderr ---"
          jq -r '.StandardErrorContent' invocation.json

          STATUS=$(jq -r '.Status' invocation.json)
          echo "Invocation status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy script failed on ${INSTANCE_ID} with status ${STATUS}"
            exit 1
          fi
